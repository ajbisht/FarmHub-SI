# ==============================================================================
# Mosquitto MQTT Broker Configuration for FarmHub (Raspberry Pi Zero 2 W)
# ==============================================================================

# Listen on all interfaces on port 1883 (so ESP32 and phone dashboard can connect)
listener 1883 0.0.0.0

# Allow anonymous access within the private mobile phone hotspot
allow_anonymous true

# Persistence settings
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest syslog
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
